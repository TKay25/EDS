{# ===== Company System PWA wiring =====
   Registered on every portal page so the system is installable and can raise
   notifications for customer conversations that need a person. #}
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#07101E">
<meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brilliant Chemicals">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='images/eds blue.png') }}">

<script>
(function () {
    if (!('serviceWorker' in navigator)) return;

    var swReady = navigator.serviceWorker.register('/static/service-worker.js')
        .catch(function () { return null; });

    window.addEventListener('load', function () { swReady; });

    // A notification shown by the page itself, for events the agent causes while
    // the CRM is open. Server-sent alerts arrive through the service worker.
    window.edsNotify = function (title, body, url) {
        if (!('Notification' in window) || Notification.permission !== 'granted') return;
        var options = { body: body, icon: '/static/images/eds blue.png',
                        badge: '/static/images/eds blue.png', tag: 'eds-crm',
                        data: { url: url || '/portal/crm' } };
        navigator.serviceWorker.ready.then(function (registration) {
            if (registration && registration.showNotification) {
                registration.showNotification(title, options);
            } else {
                new Notification(title, options);
            }
        }).catch(function () { try { new Notification(title, options); } catch (e) {} });
    };

    // ------------------------------------------------------ push notifications --
    // Browsers require the VAPID key as raw bytes, but the key travels as a
    // URL-safe base64 string.
    function urlBase64ToUint8Array(base64String) {
        var padding = '='.repeat((4 - (base64String.length % 4)) % 4);
        var base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
        var raw = window.atob(base64);
        var output = new Uint8Array(raw.length);
        for (var i = 0; i < raw.length; i += 1) output[i] = raw.charCodeAt(i);
        return output;
    }

    function post(url, body) {
        return fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body || {})
        }).then(function (response) { return response.json().catch(function () { return {}; }); });
    }

    window.edsPush = {
        supported: function () {
            return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
        },

        // Resolves { enabled, public_key } or { enabled: false }.
        config: function () {
            return fetch('/api/push/config')
                .then(function (response) { return response.json(); })
                .catch(function () { return { enabled: false }; });
        },

        // Returns { subscribed: true } or { subscribed: false, message }.
        subscribe: function () {
            if (!window.edsPush.supported()) {
                return Promise.resolve({ subscribed: false,
                    message: 'This browser cannot show push notifications.' });
            }
            return window.edsPush.config().then(function (config) {
                if (!config.enabled || !config.public_key) {
                    return { subscribed: false,
                        message: 'Notifications are not configured on this deployment yet.' };
                }
                return Notification.requestPermission().then(function (permission) {
                    if (permission !== 'granted') {
                        return { subscribed: false,
                            message: 'Notifications are blocked. Allow them in your browser settings to continue.' };
                    }
                    return navigator.serviceWorker.ready.then(function (registration) {
                        return registration.pushManager.subscribe({
                            userVisibleOnly: true,
                            applicationServerKey: urlBase64ToUint8Array(config.public_key)
                        });
                    }).then(function (subscription) {
                        return post('/api/push/subscribe', { subscription: subscription.toJSON() });
                    }).then(function (result) {
                        if (result && result.success) return { subscribed: true };
                        return { subscribed: false,
                            message: (result && result.message) || 'The subscription could not be saved.' };
                    });
                });
            }).catch(function () {
                return { subscribed: false, message: 'Notifications could not be enabled.' };
            });
        },

        unsubscribe: function () {
            if (!window.edsPush.supported()) return Promise.resolve({ subscribed: false });
            return navigator.serviceWorker.ready.then(function (registration) {
                return registration.pushManager.getSubscription();
            }).then(function (subscription) {
                if (!subscription) return { subscribed: false };
                var endpoint = subscription.endpoint;
                return subscription.unsubscribe().then(function () {
                    return post('/api/push/unsubscribe', { endpoint: endpoint });
                }).then(function () { return { subscribed: false }; });
            }).catch(function () { return { subscribed: false }; });
        },

        // Whether this device already has an active subscription.
        status: function () {
            if (!window.edsPush.supported()) return Promise.resolve(false);
            return navigator.serviceWorker.ready.then(function (registration) {
                return registration.pushManager.getSubscription();
            }).then(function (subscription) {
                return Boolean(subscription) && Notification.permission === 'granted';
            }).catch(function () { return false; });
        }
    };
})();
</script>
